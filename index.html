<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIO AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #212121;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Боковая панель --- */
        .sidebar {
            width: 260px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid #333;
        }

        .new-chat-btn {
            background-color: transparent;
            color: #ececec;
            border: 1px solid #444;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: #2a2a2a;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .history-item:hover, .history-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }

        .user-profile {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #333;
            font-size: 14px;
            cursor: pointer;
        }

        .avatar {
            width: 30px;
            height: 30px;
            background-color: #1d4ed8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
        }

        /* --- Основная область чата --- */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px 10%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-wrapper {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .msg-avatar.ai {
            background-color: #333;
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        .msg-avatar.user {
            background-color: #1d4ed8;
            color: white;
        }

        .message-content {
            background-color: transparent;
            padding: 5px 0;
            line-height: 1.6;
            font-size: 15px;
            color: #ececec;
        }

        .message-wrapper.user .message-content {
            background-color: #2a2a2a;
            padding: 12px 18px;
            border-radius: 12px;
        }

        /* --- Поле ввода --- */
        .input-container {
            padding: 20px 10%;
            background-image: linear-gradient(to top, #212121 50%, transparent);
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #444;
        }

        .input-box input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            padding: 10px 0;
        }

        .input-box input::placeholder {
            color: #888;
        }

        .send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #ccc;
        }

        .footer-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 15px;
        }
        
        /* Скрываем полосу прокрутки для красоты */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>

    <!-- Левая панель -->
    <div class="sidebar">
        <button class="new-chat-btn">
            <span>+</span> Новый чат
        </button>
        
        <div class="chat-history">
            <div class="history-item active">Последний солдат</div>
            <div class="history-item">Как угнать танк</div>
            <div class="history-item">Идеи для артов</div>
        </div>

        <div class="user-profile">
            <div class="avatar">K</div>
            <span>Kitsune</span>
        </div>
    </div>

    <!-- Основной чат -->
    <div class="main-chat">
        
        <div class="chat-messages" id="chat-box">
            
            <!-- Сообщение от пользователя -->
            <div class="message-wrapper user">
                <div class="msg-avatar user">K</div>
                <div class="message-content">
                    Привет, Кайо. Как обстановка?
                </div>
            </div>

            <!-- Сообщение от ИИ -->
            <div class="message-wrapper ai">
                <div class="msg-avatar ai">C</div>
                <div class="message-content">
                    Привет. Я Кайо. Я один на вражеской территории. Жду приказа.
                </div>
            </div>

        </div>

        <!-- Поле ввода -->
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    ↑
                </button>
            </div>
            <div class="footer-text">
                AI-generated, for reference only
            </div>
        </div>

    </div>

    <script>
        // Отправка по нажатию на Enter
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            let input = document.getElementById("user-input");
            let text = input.value;
            if (text.trim() === "") return;

            let chatBox = document.getElementById("chat-box");
            
            // Добавляем сообщение пользователя
            let userWrapper = document.createElement("div");
            userWrapper.className = "message-wrapper user";
            userWrapper.innerHTML = `
                <div class="msg-avatar user">K</div>
                <div class="message-content">${text}</div>
            `;
            chatBox.appendChild(userWrapper);
            
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Отправляем запрос на наш Python-сервер через LocalTunnel
            fetch('https://upset-friends-sin.loca.lt/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text })
            })
            .then(response => response.json())
            .then(data => {
                let aiWrapper = document.createElement("div");
                aiWrapper.className = "message-wrapper ai";
                aiWrapper.innerHTML = `
                    <div class="msg-avatar ai">C</div>
                    <div class="message-content">${data.response}</div>
                `;
                chatBox.appendChild(aiWrapper);
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error('Ошибка:', error);
                let aiWrapper = document.createElement("div");
                aiWrapper.className = "message-wrapper ai";
                aiWrapper.innerHTML = `
                    <div class="msg-avatar ai">C</div>
                    <div class="message-content">Связь с мозгом потеряна. Проверь, запущен ли Python и LocalTunnel.</div>
                `;
                chatBox.appendChild(aiWrapper);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
