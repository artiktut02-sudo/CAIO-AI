<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIO AI</title>
    <!-- Подключаем Puter.js -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #212121;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Боковая панель --- */
        .sidebar {
            width: 260px;
            background-color: #171717;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-right: 1px solid #333;
        }

        .new-chat-btn {
            background-color: transparent;
            color: #ececec;
            border: 1px solid #444;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background-color: #2a2a2a;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .history-item:hover, .history-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }

        .user-profile {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #333;
            font-size: 14px;
            cursor: pointer;
        }

        .avatar {
            width: 30px;
            height: 30px;
            background-color: #1d4ed8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
        }

        /* --- Основная область чата --- */
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px 10%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message-wrapper {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message-wrapper.user {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .msg-avatar.ai {
            background-color: #333;
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        .msg-avatar.user {
            background-color: #1d4ed8;
            color: white;
        }

        .message-content {
            background-color: transparent;
            padding: 5px 0;
            line-height: 1.6;
            font-size: 15px;
            color: #ececec;
            white-space: pre-wrap; /* Чтобы сохранять переносы строк */
        }

        .message-wrapper.user .message-content {
            background-color: #2a2a2a;
            padding: 12px 18px;
            border-radius: 12px;
        }

        /* --- Поле ввода --- */
        .input-container {
            padding: 20px 10%;
            background-image: linear-gradient(to top, #212121 50%, transparent);
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #444;
        }

        .input-box input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
            padding: 10px 0;
        }

        .input-box input::placeholder {
            color: #888;
        }

        .send-btn {
            background-color: #fff;
            color: #000;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #ccc;
        }

        .footer-text {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 15px;
        }
        
        /* Скрываем полосу прокрутки для красоты */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>

    <!-- Левая панель -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">
            <span>+</span> Новый чат
        </button>
        
        <div class="chat-history">
            <div class="history-item active">Последний солдат</div>
            <div class="history-item">Как угнать танк</div>
            <div class="history-item">Идеи для артов</div>
        </div>

        <div class="user-profile">
            <div class="avatar">K</div>
            <span>Kitsune</span>
        </div>
    </div>

    <!-- Основной чат -->
    <div class="main-chat">
        
        <div class="chat-messages" id="chat-box">
            
            <!-- Приветственное сообщение от ИИ -->
            <div class="message-wrapper ai">
                <div class="msg-avatar ai">C</div>
                <div class="message-content">
                    Привет. Я Кайо. Я один на вражеской территории. Чем могу помочь?
                </div>
            </div>

        </div>

        <!-- Поле ввода -->
        <div class="input-container">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    ↑
                </button>
            </div>
            <div class="footer-text">
                Powered by Puter.js
            </div>
        </div>

    </div>

    <script>
        // Отправка по нажатию на Enter
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        async function sendMessage() {
            let input = document.getElementById("user-input");
            let text = input.value.trim();
            if (text === "") return;

            let chatBox = document.getElementById("chat-box");
            
            // Добавляем сообщение пользователя
            let userWrapper = document.createElement("div");
            userWrapper.className = "message-wrapper user";
            userWrapper.innerHTML = `
                <div class="msg-avatar user">K</div>
                <div class="message-content">${text}</div>
            `;
            chatBox.appendChild(userWrapper);
            
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Создаем "пузырь" для ответа ИИ (с индикатором загрузки)
            let aiWrapper = document.createElement("div");
            aiWrapper.className = "message-wrapper ai";
            aiWrapper.innerHTML = `
                <div class="msg-avatar ai">C</div>
                <div class="message-content" id="ai-response-text">Думаю...</div>
            `;
            chatBox.appendChild(aiWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Обращаемся к Puter.js. 
                // Модель можно поменять на 'openai/gpt-4o' или 'deepseek-chat' (если доступна)
                const response = await puter.ai.chat(
                    [
                        { role: "system", content: "Ты — Кайо, одинокий солдат на вражеской территории. Отвечай мрачно, по-военному, но с бразильским вайбом. Ты помогаешь своему создателю с идеями для фильма 'Один в поле воин'." },
                        { role: "user", content: text }
                    ],
                    { model: 'openai/gpt-4o' } 
                );
                
                // Выводим ответ
                document.getElementById("ai-response-text").innerText = response.message.content;
            } catch (error) {
                console.error(error);
                document.getElementById("ai-response-text").innerText = "Связь с командованием потеряна. Ошибка: " + error.message;
            }
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
